<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="polka" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="4.5" fill="#fb7185" fill-opacity="0.28" />
      <circle cx="36" cy="36" r="4.5" fill="#fbbf24" fill-opacity="0.28" />
      <circle cx="36" cy="12" r="2.5" fill="#34d399" fill-opacity="0.34" />
