<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="stars" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.1" fill="#ffffff">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" begin="0s" repeatCount="indefinite" />
      </circle>
      <circle cx="45" cy="34" r="1.6" fill="#ffffff">
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" begin="0.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="70" cy="12" r="0.8" fill="#a5b4fc">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.5s" begin="1.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="24" cy="62" r="1.2" fill="#fde68a">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.5s" begin="0.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="60" cy="74" r="1" fill="#ffffff">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.8s" begin="1.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="82" cy="56" r="0.7" fill="#ffffff" fill-opacity="0.5" />
      <circle cx="8" cy="84" r="0.6" fill="#a5b4fc" fill-opacity="0.5" />
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 90 0" dur="45s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#020617" />
  <rect width="100%" height="100%" fill="url(#stars)" />
</svg>