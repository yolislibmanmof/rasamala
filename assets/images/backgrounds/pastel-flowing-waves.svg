<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="wave" width="100" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 Q25 0 50 20 T100 20" stroke="#f0abfc" stroke-width="2.5" fill="none" opacity="0.7" />
      <path d="M0 30 Q25 10 50 30 T100 30" stroke="#c4b5fd" stroke-width="2.5" fill="none" opacity="0.5" />
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 100 0" dur="7s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#faf5ff" />
  <rect width="100%" height="100%" fill="url(#wave)" />
</svg>