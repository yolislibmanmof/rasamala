<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <pattern id="lwave" width="240" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 45 Q60 5 120 45 T240 45 V80 H0 Z" fill="#ffffff" fill-opacity="0.1" />
      <path d="M0 62 Q60 26 120 62 T240 62 V80 H0 Z" fill="#ffffff" fill-opacity="0.07" />
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 240 0" dur="9s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#liquid)" />
  <rect width="100%" height="100%" fill="url(#lwave)" />
</svg>