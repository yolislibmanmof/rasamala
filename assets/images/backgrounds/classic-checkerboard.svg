<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1e293b" />
      <rect x="20" y="20" width="20" height="20" fill="#1e293b" />
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 20 20" dur="6s" repeatCount="indefinite" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#f1f5f9" />
  <rect width="100%" height="100%" fill="url(#checker)" />
</svg>